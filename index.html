<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматка Ахьаца</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f5f7;
            color: #333;
            user-select: none;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 { margin: 0; font-size: 16px; }
        .month-picker-container { display: flex; align-items: center; gap: 8px; }
        .btn-nav {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        select {
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }
        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: 75vh;
        }
        table { border-collapse: collapse; width: 100%; min-width: 1200px; }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            min-width: 42px;
            cursor: pointer;
        }
        th {
            background-color: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .cottage-header {
            position: sticky;
            left: 0;
            background: #fff;
            z-index: 3;
            text-align: left;
            font-weight: bold;
            min-width: 110px;
            padding-left: 8px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        .free { background-color: #e8f5e9; color: #2e7d32; }
        .free:active { background-color: #c8e6c9; }
        
        /* Цвета источников бронирования */
        .booked-direct {
            background-color: #e3f2fd;
            color: #1565c0;
            font-weight: bold;
            line-height: 1.1;
        }
        .booked-ical {
            background-color: #fff3e0;
            color: #e65100;
            font-weight: bold;
            line-height: 1.1;
        }
        .extra-bed-badge {
            display: inline-block;
            font-size: 9px;
            background: #ffc107;
            color: #000;
            padding: 1px 3px;
            border-radius: 3px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="header-controls">
        <h2>📅 Шахматка «Ахьаца»</h2>
        <div class="month-picker-container">
            <button class="btn-nav" onclick="changeMonth(-1)">«</button>
            <select id="monthSelect" onchange="renderCurrentSelection()"></select>
            <select id="yearSelect" onchange="renderCurrentSelection()"></select>
            <button class="btn-nav" onclick="changeMonth(1)">»</button>
        </div>
    </div>

    <div class="table-container">
        <table id="matrixTable">
            <thead>
                <tr id="dateHeader">
                    <th class="cottage-header">Номер</th>
                </tr>
            </thead>
            <tbody id="matrixBody"></tbody>
        </table>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const cottages = [
            "Стандарт №1", "Стандарт №2", "Стандарт №3", "Стандарт №4", "Стандарт №5",
            "Стандарт №6", "Стандарт №7", "Стандарт №8", "Стандарт №9", "Стандарт №10"
        ];

        const monthNames = [
            "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
            "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
        ];

        const today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        function initSelectors() {
            const mSelect = document.getElementById('monthSelect');
            const ySelect = document.getElementById('yearSelect');

            mSelect.innerHTML = '';
            monthNames.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = m;
                if (idx === currentMonth) opt.selected = true;
                mSelect.appendChild(opt);
            });

            ySelect.innerHTML = '';
            for (let y = currentYear; y <= currentYear + 2; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = y;
                if (y === currentYear) opt.selected = true;
                ySelect.appendChild(opt);
            }
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            document.getElementById('monthSelect').value = currentMonth;
            document.getElementById('yearSelect').value = currentYear;
            loadMatrix();
        }

        function renderCurrentSelection() {
            currentMonth = parseInt(document.getElementById('monthSelect').value, 10);
            currentYear = parseInt(document.getElementById('yearSelect').value, 10);
            loadMatrix();
        }

        function parseDateStr(str, year) {
            const parts = str.trim().split('.');
            if (parts.length < 2) return null;
            return new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
        }

        function isDateInBooking(cellDate, bookingDatesStr) {
            const parts = bookingDatesStr.split('-');
            const year = cellDate.getFullYear();

            if (parts.length === 2) {
                const startDate = parseDateStr(parts[0], year);
                const endDate = parseDateStr(parts[1], year);
                if (startDate && endDate) {
                    cellDate.setHours(0,0,0,0);
                    startDate.setHours(0,0,0,0);
                    endDate.setHours(0,0,0,0);
                    return cellDate >= startDate && cellDate <= endDate;
                }
            }
            return bookingDatesStr.includes(cellDate.getDate().toString().padStart(2, '0') + '.' + (cellDate.getMonth() + 1).toString().padStart(2, '0'));
        }

        function handleCellClick(cottage, dateStr, booking) {
            if (booking) {
                const extra = booking.has_extra_bed ? " (с допместом)" : "";
                const source = booking.is_ical ? "Синхронизация iCal" : "Прямое бронирование";
                tg.showPopup({
                    title: `📌 ${cottage}`,
                    message: `👤 Гость: ${booking.guest}${extra}\n🗓 Даты: ${booking.dates}\n🌐 Источник: ${source}`,
                    buttons: [{type: "ok"}]
                });
            } else {
                tg.showConfirm(`Забронировать ${cottage} на ${dateStr}?`, (confirmed) => {
                    if (confirmed) {
                        tg.sendData(JSON.stringify({action: "create_booking", cottage: cottage, date: dateStr}));
                    }
                });
            }
        }

        async function loadMatrix() {
            try {
                const response = await fetch('/api/bookings');
                const bookings = await response.json();
                
                const headerTr = document.getElementById('dateHeader');
                const body = document.getElementById('matrixBody');

                headerTr.innerHTML = '<th class="cottage-header">Номер</th>';
                body.innerHTML = '';

                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const dateObjects = [];

                for (let day = 1; day <= daysInMonth; day++) {
                    const d = new Date(currentYear, currentMonth, day);
                    dateObjects.push(d);
                    
                    const dayStr = day.toString().padStart(2, '0') + '.' + (currentMonth + 1).toString().padStart(2, '0');
                    const th = document.createElement('th');
                    th.innerText = dayStr;
                    headerTr.appendChild(th);
                }

                cottages.forEach(cottage => {
                    const tr = document.createElement('tr');
                    const tdName = document.createElement('td');
                    tdName.className = 'cottage-header';
                    tdName.innerText = cottage;
                    tr.appendChild(tdName);

                    dateObjects.forEach(dObj => {
                        const td = document.createElement('td');
                        const dayFormatted = dObj.getDate().toString().padStart(2, '0') + '.' + (dObj.getMonth() + 1).toString().padStart(2, '0');
                        
                        const booking = bookings.find(b => b.cottage === cottage && isDateInBooking(new Date(dObj), b.dates));
                        
                        if (booking) {
                            td.className = booking.is_ical ? 'booked-ical' : 'booked-direct';
                            let htmlContent = booking.guest;
                            if (booking.has_extra_bed) {
                                htmlContent += '<br><span class="extra-bed-badge">+доп</span>';
                            }
                            td.innerHTML = htmlContent;
                            td.onclick = () => handleCellClick(cottage, dayFormatted, booking);
                        } else {
                            td.className = 'free';
                            td.innerText = '🟢';
                            td.onclick = () => handleCellClick(cottage, dayFormatted, null);
                        }
                        tr.appendChild(td);
                    });

                    body.appendChild(tr);
                });

            } catch (err) {
                console.error("Ошибка загрузки:", err);
            }
        }

        initSelectors();
        loadMatrix();
    </script>
</body>
</html>
